spring.application.name=EMS

jwt.secret=${JWT_SECRET}


# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# MYSQL DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/EMS?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING  (handled by logback-spring.xml)
# ===============================
# Log files are written to: logs/ems-app.log
# Format: ELK/Kibana-compatible JSON (logstash-logback-encoder)


# SMTP Server Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.password=${SMTP_PASSWORD}
spring.mail.username=${SMTP_USER}

# Security and Protocol Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=http://localhost:8080
password.change.path=/api/employee/change-password